      type: "STRING"
      mode: "REQUIRED"
    - name: "date"
      type: "DATE"
      mode: "REQUIRED"
    - name: "time"
      type: "TIME"
      mode: "REQUIRED" 
    - name: "oldBalanceOrg"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "nameDest"
      type: "STRING"
      mode: "NULLABLE"
    - name: "step"
      type: "INT64"
      mode: "NULLABLE"
    - name: "newBalanceDest"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "nameOrig"
      type: "STRING"
      mode: "NULLABLE"
    - name: "type"
      type: "STRING"
      mode: "NULLABLE"
    - name: "amount"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "newBalanceOrig"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "oldBalanceDest"
      type: "FLOAT64"
      mode: "NULLABLE"